[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkforge"
version = "1.0.0"
description = "Google AI Pro redemption link farm on Jio selfcare: rent a number, log in by OTP, mine one link"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
linkforge = "linkforge.cli:app"

[tool.setuptools.packages.find]
include = ["linkforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
